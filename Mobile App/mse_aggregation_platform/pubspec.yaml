name: mse_aggregation_platform
description: "MSE Aggregation Platform - Connecting Orders with MSEs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP client + cookie-based session handling
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Secure local storage
  flutter_secure_storage: ^9.0.0

  # Path for cookie jar persistence
  path_provider: ^2.1.3

  # Fonts
  google_fonts: ^6.2.1

  # Internationalisation / date formatting
  intl: ^0.19.0

  # Network connectivity detection
  connectivity_plus: ^6.0.3

  # Star rating UI widget
  flutter_rating_bar: ^4.0.1

  # Default icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

