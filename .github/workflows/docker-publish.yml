name: Build and Push Docker Image
  
on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: udaynaik07/mse-aggregation-platform

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract short git SHA for image tagging
      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 3. Set up Docker Buildx (enables multi-platform & layer caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and push the image with two tags: latest + git SHA
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Print summary
      - name: Image pushed summary
        run: |
          echo "✅ Image pushed successfully!"
          echo "   Tags:"
          echo "     - ${{ env.DOCKER_IMAGE }}:latest"
          echo "     - ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.sha_short }}"
